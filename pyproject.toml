[project]
name = "transcriber"
version = "0.1.0"
description = "음원을 악보로 변환하는 프로그램"
requires-python = ">=3.11,<3.12"
dependencies = [
    "basic-pitch>=0.4.0",
    "demucs>=4.1.0",
    "librosa>=0.10",
    "music21>=10.5.2",
    "setuptools<81",
    "soundfile>=0.12",
]

[project.scripts]
transcribe = "transcriber.cli:main"
render = "transcriber.render:main"
rhythm-stats = "transcriber.rhythm_stats:main"
chord-stats = "transcriber.chord_stats:main"
chord-name = "transcriber.chord_names:main"
separate = "transcriber.analysis.separation:main"
beats = "transcriber.analysis.beats:main"
notes = "transcriber.analysis.notes:main"
rhythm = "transcriber.analysis.rhythm:main"
harmony = "transcriber.analysis.harmony:main"
key = "transcriber.analysis.tonality:main"
structure = "transcriber.analysis.structure:main"
expression = "transcriber.analysis.expression:main"
melody = "transcriber.analysis.melody:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transcriber"]
